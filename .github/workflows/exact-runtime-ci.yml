name: Exact runtime CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "11.15.1"

jobs:
  controller:
    name: Controller (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          check-latest: false
      - name: Install and assert exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          node tools/milestone-orchestrator/ci/assert-exact-toolchain.mjs --output artifacts/ci/controller-${{ matrix.platform }}/toolchain.json
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --package-import-method=copy
      - name: Run invariant suite
        run: pnpm test:invariants
        env:
          LOOP_VERIFY_COMMAND_ARTIFACT_DIR: artifacts/ci/controller-${{ matrix.platform }}/invariants
      - name: Run controller suite
        run: pnpm test:orchestrator
        env:
          LOOP_VERIFY_COMMAND_ARTIFACT_DIR: artifacts/ci/controller-${{ matrix.platform }}/orchestrator
      - name: Run complete unit suite
        run: pnpm test:unit
        env:
          LOOP_VERIFY_COMMAND_ARTIFACT_DIR: artifacts/ci/controller-${{ matrix.platform }}/unit
      - name: Run typecheck
        run: pnpm typecheck
        env:
          LOOP_VERIFY_COMMAND_ARTIFACT_DIR: artifacts/ci/controller-${{ matrix.platform }}/typecheck
      - name: Run lint
        run: pnpm lint
        env:
          LOOP_VERIFY_COMMAND_ARTIFACT_DIR: artifacts/ci/controller-${{ matrix.platform }}/lint
      - name: Run format check
        run: pnpm format:check
        env:
          LOOP_VERIFY_COMMAND_ARTIFACT_DIR: artifacts/ci/controller-${{ matrix.platform }}/format
      - name: Retain controller evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controller-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/ci/controller-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

  fresh-adopter-smoke:
    name: Fresh adopter smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          check-latest: false
      - name: Install and assert exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          node tools/milestone-orchestrator/ci/assert-exact-toolchain.mjs --output artifacts/ci/fresh-adopter-${{ matrix.platform }}/toolchain.json
      - name: Install frozen source dependencies
        run: pnpm install --frozen-lockfile --package-import-method=copy
      - name: Generate and exercise a fresh adopter
        run: >-
          pnpm exec tsx tools/milestone-orchestrator/ci/fresh-adopter-smoke.ts
          --definition fixtures/fresh-adopter/definition.json
          --output artifacts/ci/fresh-adopter-${{ matrix.platform }}/smoke
      - name: Retain fresh-adopter smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fresh-adopter-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/ci/fresh-adopter-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

  trusted-container:
    name: Trusted container (Linux Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          check-latest: false
      - name: Install and assert exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          node tools/milestone-orchestrator/ci/assert-exact-toolchain.mjs --output artifacts/ci/trusted-container/toolchain.json
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --package-import-method=copy
      - name: Hydrate exact OCI fixture store
        run: |
          fixture_fetch_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_fetch_dir"' EXIT
          git archive HEAD:fixtures/oci-candidate | tar -x -C "$fixture_fetch_dir"
          pnpm --dir "$fixture_fetch_dir" --ignore-workspace fetch --frozen-lockfile
      - name: Confirm real Docker Engine
        run: |
          docker version > artifacts/ci/trusted-container/docker-version.txt
          docker info > artifacts/ci/trusted-container/docker-info.txt
      - name: Run real trusted-container matrix
        run: pnpm test:oci-container --output artifacts/ci/trusted-container/matrix
      - name: Retain trusted-container evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-container-linux-${{ github.sha }}
          path: artifacts/ci/trusted-container
          if-no-files-found: error
          retention-days: 14
