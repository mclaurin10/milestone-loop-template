<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Fresh Adopter Bootstrap</title>
    <style>
      :root {
        color: #e8f2ff;
        background: #07111f;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, #17345c 0, transparent 40%),
          linear-gradient(145deg, #07111f, #0b2038);
      }
      main {
        width: min(720px, calc(100vw - 64px));
        padding: 48px;
        border: 1px solid #31567d;
        border-radius: 24px;
        background: rgb(8 24 42 / 92%);
        box-shadow: 0 30px 80px rgb(0 0 0 / 35%);
      }
      .eyebrow {
        margin: 0 0 8px;
        color: #79c7ff;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1;
      }
      #status {
        min-height: 1.5em;
        color: #b9d5ee;
      }
      button {
        margin: 24px 0;
        padding: 14px 20px;
        border: 0;
        border-radius: 12px;
        color: #04111f;
        background: #7bd3ff;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      pre {
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        color: #7fffd4;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Deterministic technical scaffold</p>
      <h1>Fresh adopter loop</h1>
      <p id="status" data-state="loading">Starting production Worker…</p>
      <button id="extract-action" type="button">Run public action</button>
      <pre id="checkpoint" aria-label="Canonical checkpoint"></pre>
    </main>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
